[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
spectra-core = { path = "crates/spectra-core" }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tempfile = "3"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"

# Dependencies (iced, wgpu, naga) optimised for size; Spectra's own code for speed.
[profile.release.package."*"]
opt-level = "s"

# For trying changes: as fast to run as a release build, near enough, but
# without the whole-program pass that makes one take minutes to link.
# `cargo run --profile fast -p spectra`
[profile.fast]
inherits = "release"
codegen-units = 16
lto = false
incremental = true
